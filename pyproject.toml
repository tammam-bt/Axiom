[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "axiom-ml"
version = "0.1.2"
description = "Axiom is a Python library for building and deploying machine learning models."
authors = [{ name = "BenBettayeb Tammam", email = "tambett10@gmail.com" }]
dependencies = [
    "numpy >= 1.24",
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
# Only the test suite needs these; the library itself depends on NumPy alone.
test = ["pytest", "scikit-learn"]

[project.urls]
Homepage = "https://github.com/tammam-bt/Axiom.git"

[tool.pytest.ini_options]
testpaths = ["tests"]